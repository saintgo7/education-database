version: '3.8'

services:
  cassandra:
    image: cassandra:4.1
    container_name: cassandra-nosql
    environment:
      - CASSANDRA_CLUSTER_NAME=education-cluster
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_RACK=rack1
      - CASSANDRA_SEEDS=cassandra
    ports:
      - "7000:7000"
      - "7001:7001"
      - "9042:9042"
      - "9160:9160"
    volumes:
      - cassandra-data:/var/lib/cassandra
      - ./config/cassandra.yaml:/etc/cassandra/cassandra.yaml
    networks:
      - education-network
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "SELECT cluster_name FROM system.local"]
      interval: 30s
      timeout: 10s
      retries: 5

  cassandra-web:
    image: cassandra-web:latest
    container_name: cassandra-web
    environment:
      - CASSANDRA_HOSTNAME=cassandra
      - CASSANDRA_PORT=9042
    ports:
      - "3000:3000"
    depends_on:
      - cassandra
    networks:
      - education-network

volumes:
  cassandra-data:

networks:
  education-network:
    driver: bridge
