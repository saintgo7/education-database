version: '3.8'

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: timescaledb-timeseries
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password123
      - POSTGRES_DB=timeseries_db
    ports:
      - "5433:5432"
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
      - ./scripts/init/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    networks:
      - education-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin-timescale:
    image: dpage/pgadmin4:latest
    container_name: pgadmin-timescale
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@example.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5051:80"
    depends_on:
      - timescaledb
    networks:
      - education-network

volumes:
  timescaledb-data:

networks:
  education-network:
    driver: bridge
